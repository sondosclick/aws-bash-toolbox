name: ci

on:
  push:
  pull_request:

jobs:
  bash-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: shellcheck abt.sh install.sh
      - name: Bash syntax
        run: |
          bash -n abt.sh
          bash -n install.sh
